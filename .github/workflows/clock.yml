name: ClockName

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clockname
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install telethon tzdata

      - name: Restore session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: printf '%s' "$TELEGRAM_SESSION" | tr -d ' \n\r\t' | base64 -d > clockname_session.session

      - name: Tick the clock
        run: python ClockName.py --once

      - name: Heartbeat (keeps repository active)
        run: |
          git config user.name "clockname-bot"
          git config user.email "actions@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "tick" || echo "nothing to commit"
          git push || echo "push skipped"
