name: ClockName Loop

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: clockname-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git (for state commits)
        run: |
          git config user.name "clockname-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install telethon tzdata requests

      - name: Restore session
        env:
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: printf '%s' "$TELEGRAM_SESSION" | tr -d ' \n\r\t' | base64 -d > clockname_session.session

      - name: Fresh-run check (scheduled runs only)
        id: fresh
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api "repos/${{ github.repository }}/actions/runs?per_page=10" --jq '[.workflow_runs[] | select(.name == "ClockName Loop")] | map(.updated_at) | max // empty' 2>/dev/null || echo "")
          if [ -n "$LATEST" ]; then
            T=$(date -u -d "$LATEST" +%s 2>/dev/null || echo 0)
            AGE=$(( $(date -u +%s) - T ))
            echo "latest run ended ${AGE}s ago"
            if [ "$AGE" -lt 900 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "fresh run active — hourly cron skips to avoid double-ticking"
            fi
          fi

      - name: Run clock loop (every minute + control bot)
        id: loop
        if: steps.fresh.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          LOOP_MINUTES: "238"
          GH_STATE: "yes"
        run: python ClockName.py --loop

      - name: Heartbeat (keeps repository active)
        if: always() && (steps.fresh.outputs.skip != 'true')
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .heartbeat
          git add .heartbeat
          git commit -m "tick" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Chain next run (24/7 continuity)
        if: always() && (steps.loop.conclusion != 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/actions/workflows/loop.yml/dispatches" -f ref="main" || echo "chain dispatch failed — hourly cron will recover"
